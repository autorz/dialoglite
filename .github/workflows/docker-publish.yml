name: Release artifacts (Docker image + Android APK)

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Os dois jobs abaixo são INDEPENDENTES de propósito: o app web está em
# produção e tem prioridade, então nada no caminho do APK pode reprovar (nem
# atrasar) a publicação da imagem. Não adicione `needs:` entre eles.
jobs:
  build-and-push:
    name: Docker image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU + buildx: os runners do GitHub são amd64. Sem isto a imagem sai
      # amd64-only e não roda nos hosts aarch64 onde o app está implantado.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            latest

      # context é ./server (monorepo): o Dockerfile termina em `COPY . /app`,
      # então um context na raiz arrastaria android/ (caches do Gradle, saídas
      # de build, keystore de quem estiver testando local) para dentro da
      # imagem publicada. O .dockerignore também vive em server/.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    # Rede de segurança: mesmo que este job falhe, o run não é marcado como
    # falho. A imagem em produção manda.
    continue-on-error: true
    permissions:
      contents: write # necessário para anexar o APK ao release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enquanto android/ não existir na ref, o job passa em verde com um
      # aviso — não é falha, é ausência.
      - name: Detect Android project
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ hashFiles('android/**') }}" = "" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=APK skipped::android/ ainda não existe nesta ref. Nada a construir — isto não é uma falha."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Gradle wrapper checksum
        if: steps.detect.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.detect.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      # O módulo Android exige platform 36 e build-tools 36. O que vem
      # pré-instalado varia com a imagem do runner, então instalamos
      # explicitamente em vez de depender disso (ou do download automático do
      # AGP). Este passo também resolve, num lugar só, o diretório de
      # build-tools que o passo de assinatura vai usar.
      - name: Ensure Android SDK packages
        id: sdk
        if: steps.detect.outputs.present == 'true'
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ]; then
            echo "::error title=SDK ausente::ANDROID_HOME/ANDROID_SDK_ROOT não definidos no runner."
            exit 1
          fi

          sdkmgr="${sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmgr" ]; then
            mapfile -t cands < <(find "$sdk" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort)
            if [ "${#cands[@]}" -eq 0 ]; then
              echo "::error title=sdkmanager ausente::não encontrei sdkmanager sob ${sdk}."
              exit 1
            fi
            sdkmgr="${cands[0]}"
          fi

          # Aceite de licença por ARQUIVO, não por `yes | sdkmanager`: com
          # `set -o pipefail` o `yes` morre de SIGPIPE quando o sdkmanager
          # termina e o pipeline devolve 141, abortando o job por engano.
          printf 'y\n%.0s' $(seq 1 100) > "${RUNNER_TEMP}/sdk-accept.txt"
          # A saída vai para arquivo só para conter as barras de progresso, não
          # para esconder diagnóstico: warning/error do sdkmanager são
          # reemitidos abaixo, e em caso de falha o log inteiro vai para o log
          # do job. Warning tolerado tem que ficar visível.
          sdklog="${RUNNER_TEMP}/sdkmanager.log"
          if ! "$sdkmgr" "platforms;android-36" "build-tools;36.0.0" \
               < "${RUNNER_TEMP}/sdk-accept.txt" > "$sdklog" 2>&1; then
            echo "::error title=sdkmanager falhou::não consegui instalar platform 36 / build-tools 36."
            cat "$sdklog"
            exit 1
          fi
          if grep -iE '(^|[^a-z])(warning|deprecat)' "$sdklog"; then
            echo "::warning title=sdkmanager reclamou::veja as linhas acima — toleradas, mas não silenciadas."
          fi
          rm -f "${RUNNER_TEMP}/sdk-accept.txt"

          mapfile -t bts < <(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V)
          if [ "${#bts[@]}" -eq 0 ]; then
            echo "::error title=build-tools ausente::sdkmanager não deixou build-tools em ${sdk}."
            exit 1
          fi
          bt="${bts[$(( ${#bts[@]} - 1 ))]}"
          echo "build-tools: ${bt}"
          echo "buildtools=${bt}" >> "$GITHUB_OUTPUT"

      # Decide entre assinar com a keystore de release (secrets configurados)
      # ou com a chave de debug. Nada do valor do secret é impresso: só o
      # comprimento zero / não-zero decide o caminho.
      - name: Resolve signing mode and release tag
        id: prep
        if: steps.detect.outputs.present == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning title=APK assinado em DEBUG::Os secrets ANDROID_KEYSTORE_BASE64/PASSWORD/KEY_ALIAS/KEY_PASSWORD não estão configurados. O APK será assinado com a chave de debug do Android, que é pública: serve para sideload/teste e NÃO para distribuição. Um build debug-signed também não pode ser atualizado no lugar por um build assinado de verdade (o Android recusa troca de assinatura). Veja a seção 'Signing the APK' no README."
          fi
          tag="${RELEASE_TAG:-}"
          if [ -z "$tag" ]; then
            tag="dispatch-${GITHUB_SHA:0:7}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Nenhuma credencial de assinatura é exportada para o Gradle, de
      # propósito. O `app/build.gradle.kts` assina se enxergar as variáveis
      # DIALOGLITE_KEYSTORE*, mas deixá-lo assinar criaria DOIS caminhos de
      # assinatura (Gradle e apksigner) e dois nomes de saída possíveis. Aqui
      # o Gradle sempre produz `app-release-unsigned.apk` e o passo seguinte é
      # a única autoridade de assinatura — um lugar só para auditar, e o
      # apksigner nunca precisa reassinar um APK já assinado.
      - name: Test and assemble release APK
        if: steps.detect.outputs.present == 'true'
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -x ./gradlew ]; then
            if [ -f ./gradlew ]; then
              chmod +x ./gradlew
            else
              echo "::error title=Gradle wrapper ausente::android/ existe mas não tem ./gradlew — não dá para construir o APK."
              exit 1
            fi
          fi
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Sign and align APK
        id: sign
        if: steps.detect.outputs.present == 'true'
        env:
          SIGN_MODE: ${{ steps.prep.outputs.mode }}
          TAG: ${{ steps.prep.outputs.tag }}
          BT: ${{ steps.sdk.outputs.buildtools }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # --- localizar o APK produzido pelo Gradle -----------------------
          mapfile -t apks < <(find android -type f -path '*/build/outputs/apk/release/*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error title=Nenhum APK::assembleRelease não produziu APK em */build/outputs/apk/release/."
            exit 1
          fi
          if [ "${#apks[@]}" -gt 1 ]; then
            printf '::warning title=Mais de um APK::%s\n' "${apks[*]}"
          fi
          # Preferência explícita pelo unsigned: é o que o Gradle deve produzir
          # (ver o passo anterior). Não depender da ordem alfabética.
          raw="${apks[0]}"
          for a in "${apks[@]}"; do
            case "$a" in
              *-unsigned.apk) raw="$a"; break ;;
            esac
          done
          echo "APK bruto: ${raw}"

          # --- build-tools (zipalign/apksigner), resolvido no passo `sdk` ---
          bt="${BT:-}"
          if [ -z "$bt" ] || [ ! -x "${bt}/apksigner" ]; then
            echo "::error title=build-tools ausente::caminho '${bt}' não tem apksigner. O passo 'Ensure Android SDK packages' deveria tê-lo resolvido."
            exit 1
          fi

          # --- keystore ----------------------------------------------------
          # Fica em RUNNER_TEMP, FORA do checkout: não pode ser varrido para
          # dentro do APK como recurso nem acabar num commit.
          ks="${RUNNER_TEMP}/release.jks"
          if [ "$SIGN_MODE" = "release" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
            export SIGN_KS_PASS="$KS_PASS"
            export SIGN_KEY_PASS="${KEY_PASS:-$KS_PASS}"
            alias_name="${KEY_ALIAS:-}"
            suffix=""
          else
            ks="${HOME}/.android/debug.keystore"
            if [ ! -f "$ks" ]; then
              mkdir -p "${HOME}/.android"
              keytool -genkeypair -v -keystore "$ks" \
                -storepass android -keypass android \
                -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' \
                -keyalg RSA -keysize 2048 -validity 10000 >/dev/null
            fi
            export SIGN_KS_PASS="android"
            export SIGN_KEY_PASS="android"
            alias_name="androiddebugkey"
            suffix="-debug-signed"
          fi

          # --- zipalign ANTES de assinar (v2/v3 exigem alinhamento) --------
          out_dir="${RUNNER_TEMP}/apk-out"
          mkdir -p "$out_dir"
          final="${out_dir}/dialoglite-${TAG}${suffix}.apk"
          "${bt}/zipalign" -p -f 4 "$raw" "${out_dir}/aligned.apk"

          # Senhas entram por referência de ambiente (env:VAR): nunca como
          # argumento de linha de comando, que apareceria em `ps` e em logs.
          # O alias é opcional: se ANDROID_KEY_ALIAS não estiver configurado e a
          # keystore tiver uma única entrada, o apksigner a escolhe sozinho.
          # Melhor isso do que reprovar o release por um secret esquecido.
          alias_args=()
          if [ -n "$alias_name" ]; then
            alias_args=(--ks-key-alias "$alias_name")
          fi
          "${bt}/apksigner" sign \
            --ks "$ks" \
            "${alias_args[@]}" \
            --ks-pass env:SIGN_KS_PASS \
            --key-pass env:SIGN_KEY_PASS \
            --out "$final" \
            "${out_dir}/aligned.apk"
          "${bt}/apksigner" verify --print-certs "$final"

          rm -f "${out_dir}/aligned.apk"
          echo "apk=${final}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$final")" >> "$GITHUB_OUTPUT"

      # O APK vai para um release de repositório PÚBLICO. Este passo é a
      # última barreira: falha duro se material de segredo tiver vazado para
      # dentro do pacote, e avisa sobre endereços internos.
      - name: Scan APK for leaked secrets
        if: steps.detect.outputs.present == 'true'
        env:
          APK: ${{ steps.sign.outputs.apk }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/apk-scan"
          rm -rf "$work" && mkdir -p "$work"
          unzip -qo "$APK" -d "$work"

          fail=0
          # Segredos: falha. `grep -q` não imprime o que casou.
          for secret in "${KS_PASS:-}" "${KEY_PASS:-}"; do
            if [ -n "$secret" ] && [ "${#secret}" -ge 6 ] \
               && grep -raqF -- "$secret" "$work"; then
              echo "::error title=Segredo no APK::A senha da keystore aparece dentro do APK. Publicação abortada."
              fail=1
            fi
          done
          for pattern in 'BEGIN [A-Z ]*PRIVATE KEY' 'ghp_[A-Za-z0-9]{36}' 'github_pat_[A-Za-z0-9_]{20,}'; do
            if grep -raqE -- "$pattern" "$work"; then
              echo "::error title=Credencial no APK::padrão '${pattern}' encontrado dentro do APK. Publicação abortada."
              fail=1
            fi
          done
          # --- endereços internos ------------------------------------------
          # Detector fixo. Cada padrão encontrado vira `::notice::` com a
          # justificativa se estiver registrado em .github/apk-scan-accepted.txt,
          # e `::warning::` alto se não estiver. Aviso que dispara em todo
          # release vira ruído — registrar é assumir a decisão por escrito.
          watch=('100\.70\.[0-9]' '192\.168\.[0-9]' 'zippert\.me' 'netbird')

          accept_file=".github/apk-scan-accepted.txt"
          declare -A acc_who=() acc_when=() acc_why=()
          # Trim sem `xargs`: xargs comeria as barras invertidas do regex.
          trim() {
            local v="$1"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }
          if [ -f "$accept_file" ]; then
            while IFS='|' read -r f_pat f_who f_when f_why || [ -n "${f_pat:-}" ]; do
              f_pat="$(trim "${f_pat:-}")"
              case "$f_pat" in ''|'#'*) continue ;; esac
              if [ -z "${f_why:-}" ]; then
                echo "::error title=Registro malformado::'${f_pat}' em ${accept_file} não tem os quatro campos (regex | quem | data | por quê)."
                fail=1
                continue
              fi
              acc_who["$f_pat"]="$(trim "$f_who")"
              acc_when["$f_pat"]="$(trim "$f_when")"
              acc_why["$f_pat"]="$(trim "$f_why")"
            done < "$accept_file"
          fi

          # Padrão aceito que não casa com nada é dívida silenciosa: reprova.
          for pat in "${!acc_who[@]}"; do
            if ! grep -raqE -- "$pat" "$work"; then
              echo "::error title=Padrão aceito órfão::'${pat}' está registrado em ${accept_file} mas não casa com nada no APK. A string saiu do app — remova a linha."
              fail=1
            fi
          done

          for pattern in "${watch[@]}"; do
            grep -raqE -- "$pattern" "$work" || continue
            if [ -n "${acc_who[$pattern]:-}" ]; then
              echo "::notice title=Padrão interno aceito::'${pattern}' encontrado — aceito por ${acc_who[$pattern]} em ${acc_when[$pattern]}: ${acc_why[$pattern]}"
            else
              echo "::warning title=Endereço interno no APK::padrão '${pattern}' encontrado e NÃO registrado. Se for intencional, registre em ${accept_file} com justificativa; o APK é público."
            fi
          done

          rm -rf "$work"
          exit "$fail"

      - name: Upload APK as workflow artifact
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.name }}
          path: ${{ steps.sign.outputs.apk }}
          if-no-files-found: error

      - name: Attach APK to the release
        if: steps.detect.outputs.present == 'true' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          APK: ${{ steps.sign.outputs.apk }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" --clobber

      # A keystore decodificada não pode sobreviver ao job nem em caso de erro.
      - name: Shred decoded keystore
        if: always()
        run: |
          set -euo pipefail
          ks="${RUNNER_TEMP}/release.jks"
          if [ -f "$ks" ]; then
            shred -u "$ks" || rm -f "$ks"
          fi
