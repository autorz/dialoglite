# O nome do projeto é fixado: sem isto o compose o derivaria do
# diretório e passaria a ser "server" depois da mudança para monorepo.
name: dialoglite

services:
  app:
    build:
      context: .
    container_name: dialoglite
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URI=sqlite:////app/data/app.db
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
